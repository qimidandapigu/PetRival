<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小精灵 · 路线优化对照</title><link rel="stylesheet" href="/ai-comparison.css"><script type="module" src="/ai-comparison.mjs"></script></head>
<body><main><header><span class="eyebrow">小精灵的推箱子练习</span><h1>少绕一点路。</h1><p>同一模型、关闭思考、同一组四关。这里回放的是实际执行过的动作。</p><div class="totals"><span>通关 <b>4 / 4 → 4 / 4</b></span><span>合计步数 <b>95 → 72</b></span><span>合计用时 <b>65.0 → 53.6 秒</b></span></div></header>
